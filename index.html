<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NYC Quest: 24 Hours</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--text:#1b2233;--muted:#667086;--accent:#f5a800;--accent-t:#1b2233;--ok:#1f9d63;--line:#e3dfd5;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1524;--card:#18203a;--text:#eef1f8;--muted:#9aa4bd;--accent:#ffc629;--accent-t:#1b2233;--ok:#3ddc97;--line:#2a3354}}
:root[data-theme="dark"]{--bg:#0f1524;--card:#18203a;--text:#eef1f8;--muted:#9aa4bd;--accent:#ffc629;--accent-t:#1b2233;--ok:#3ddc97;--line:#2a3354}
html{height:100%;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 150px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);padding:12px 16px 10px;border-bottom:1px solid var(--line)}
.wrap{max-width:640px;margin:0 auto}
h1{margin:0;font-size:20px}
.sub{color:var(--muted);font-size:13px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.lvl{font-weight:700;font-size:14px}
.bar{height:12px;background:var(--line);border-radius:99px;overflow:hidden;margin:8px 0 4px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--ok));border-radius:99px;transition:width .5s}
.stats{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.badge{font-size:12px;padding:3px 9px;border-radius:99px;border:1px dashed var(--line);color:var(--muted);filter:grayscale(1);opacity:.7}
.badge.on{filter:none;opacity:1;border:1px solid var(--accent);color:var(--text);background:color-mix(in srgb,var(--accent) 18%,transparent)}
main{padding:14px 16px 90px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;margin-bottom:16px;position:relative;transition:opacity .3s}
.card.done{opacity:.72}
.card.skip{opacity:.5}
.card.next{border:2px solid var(--accent);box-shadow:0 6px 24px color-mix(in srgb,var(--accent) 25%,transparent)}
.art{height:110px;display:flex;align-items:center;justify-content:center;font-size:58px;background:linear-gradient(135deg,hsl(var(--h) 70% 55%),hsl(calc(var(--h) + 40) 70% 38%))}
.body{padding:14px 16px 16px}
.top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}
.time{background:var(--accent);color:var(--accent-t);font-weight:700;border-radius:8px;padding:2px 9px}
.dur{color:var(--muted)}
.tag{margin-left:auto;font-size:12px;font-weight:700;color:var(--ok)}
h2{margin:8px 0 4px;font-size:19px}
p{margin:6px 0}
.tip{font-size:14px;color:var(--muted)}
.go{background:color-mix(in srgb,var(--text) 6%,transparent);border-radius:12px;padding:10px 12px;margin:10px 0;font-size:14px}
.quest{display:flex;gap:10px;align-items:flex-start;background:color-mix(in srgb,var(--accent) 12%,transparent);border-radius:12px;padding:10px 12px;margin:10px 0;font-size:14px;cursor:pointer}
.quest input{width:20px;height:20px;margin-top:2px;accent-color:var(--ok);flex:none}
.quest b{color:var(--ok);white-space:nowrap}
.links{display:flex;gap:8px;margin:8px 0}
.links a{flex:1;text-align:center;text-decoration:none;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:8px;font-size:14px}
textarea{width:100%;min-height:52px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);padding:8px 10px;font:inherit;font-size:14px;resize:vertical}
.acts{display:flex;gap:8px;margin-top:10px}
button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:12px;cursor:pointer;background:var(--accent);color:var(--accent-t);flex:2}
button.ghost{background:transparent;color:var(--muted);border:1px solid var(--line);flex:1}
button.undo{background:var(--ok);color:#06231a}
.reset{display:block;margin:6px auto 0;background:transparent;color:var(--muted);border:1px solid var(--line);flex:none;padding:8px 16px;font-size:13px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,40px);opacity:0;background:var(--text);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:700;z-index:20;transition:.3s;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{transform:translate(-50%,0);opacity:1}
</style>
</head>
<body>
<header><div class="wrap" id="hd"></div></header>
<main><div class="wrap" id="app"></div></main>
<div id="toast"></div>
<script>
var S=[
{id:"s1",t:"9:00 AM",n:"Brooklyn Bridge + DUMBO",e:"🌉",h:210,dur:"~90 min",d:"DUMBO ki Washington Street se bridge ke neeche wala famous skyline shot lo, phir Brooklyn Bridge ki pedestrian path par Manhattan ki taraf walk karo (~30 min). Chaho toh DUMBO mein coffee ya bagel ka chhota break le lo.",tip:"Walkway ka upar wala hissa pedestrians ke liye hai, cyclists ki lane se bach ke chalo.",go:"Hostel se 86 St (Central Park West) par downtown C train lo aur seedha High St–Brooklyn Bridge utro (~35–40 min, $3, change ki zarurat nahi). Phir DUMBO se bridge walk karke Manhattan pahucho.",q:"Bridge ke beech mein skyline ke saath selfie lo",m:"Brooklyn Bridge New York"},
{id:"s2",t:"10:30 AM",n:"9/11 Memorial & Oculus",e:"🕊️",h:220,dur:"~75 min",d:"Do reflecting pools jahan Twin Towers the, kinaron par naamon wali bronze panels hain. Paas mein Oculus ka safed winged structure dekhne layak hai.",tip:"Memorial plaza free hai. Museum optional hai aur time zyada leta hai.",go:"Bridge ke baad City Hall se Oculus tak walk karo, ~20 min ($0).",q:"Oculus ke andar ek architecture photo lo",m:"National 9/11 Memorial New York"},
{id:"s3",t:"11:45 AM",n:"Wall Street & Charging Bull",e:"🐂",h:30,dur:"~45 min",d:"Charging Bull, Fearless Girl statue aur NYSE ka famous facade, sab paas-paas hain.",tip:"Bull ke saath photo ke liye line lagti hai. Side se bhi achhi photo aati hai.",go:"Oculus se Broadway ke raste south walk karo, Bowling Green tak ~15 min ($0).",q:"Wall Street ke sign ke saath photo lo",m:"Charging Bull New York"},
{id:"s4",t:"12:45 PM",n:"LUNCH: Chelsea Market",e:"🌮",h:15,dur:"60 min",d:"Purani biscuit factory mein bana food hall: tacos, lobster rolls, ramen, desserts. Aaram se baith ke poora ek ghanta lunch karo.",tip:"Weekend par bheed hoti hai, seat jaldi pakdo. Veg options ke liye stalls ke menu dekh lo.",go:"Wall St station se 2 ya 3 train uptown lo, 14 St–7 Av par utro (~12–15 min, $3). Phir 14th St par west ki taraf ~10 min walk karke 9th Ave & 15th St.",q:"Ek aisi dish try karo jo pehle kabhi nahi khayi",m:"Chelsea Market New York"},
{id:"s5",t:"2:00 PM",n:"The High Line + Hudson Yards",e:"🌿",h:130,dur:"~90 min",d:"Purani elevated rail line par bana park, street art aur Hudson River ke views ke saath. Aage Hudson Yards aur Vessel tak walk karo. Beech mein benches par rest le sakte ho.",tip:"Chelsea Market ke paas se chadho aur north ki taraf chalo (~1.5 mile).",go:"Chelsea Market ke paas hi High Line ki entry hai (Gansevoort ya 14th St side). North ki taraf walk karke Hudson Yards (34 St) tak jao ($0).",q:"Koi ek street art ya Vessel ki photo lo",m:"The High Line New York"},
{id:"s6",t:"3:45 PM",n:"Grand Central + Bryant Park break",e:"🚂",h:190,dur:"~60 min",d:"Grand Central ki turquoise ceiling aur main concourse dekho, phir Bryant Park mein 30 minute ka chai ya coffee break lo.",tip:"Concourse ki balcony se photo achhi aati hai.",go:"Hudson Yards (34 St) se 7 train lo, Grand Central–42 St par utro (~10 min, $3).",q:"Main concourse ki clock ke saath photo lo",m:"Grand Central Terminal New York"},
{id:"s7",t:"5:00 PM",n:"Top of the Rock",e:"🌇",h:350,dur:"~75 min",d:"Rockefeller Center ke upar observation deck. Empire State Building aur Central Park ka view milta hai, sunset 6 baje ke aas-paas hota hai.",tip:"Ticket pehle se online book karo, sunset slot jaldi bhar jata hai.",go:"Bryant Park se 5th Ave par ~15 min walk karo ($0). Ya 42 St–Bryant Park se B/D/F/M lo aur 47–50 Sts–Rockefeller Ctr utro (1 stop, $3).",q:"Empire State Building ke saath sunset photo lo",m:"Top of the Rock New York"},
{id:"s8",t:"6:30 PM",n:"Times Square",e:"✨",h:290,dur:"~60 min",d:"Neon billboards, Broadway theatres aur TKTS ki red steps. Andhera hone ke baad sabse zyada mazaa aata hai.",tip:"Halloween ki wajah se bheed zyada hogi. Phone aur wallet dhyan se rakho.",go:"Top of the Rock se Times Square ~12 min walk hai ($0).",q:"Red steps par baith ke ek video lo",m:"Times Square New York"},
{id:"s9",t:"7:30 PM",n:"DINNER BREAK",e:"🍽️",h:5,dur:"~90 min",d:"Aaj ka main rest. Times Square ke paas touristy jagah se bachna hai toh Hell’s Kitchen (9th Avenue) mein kai achhe restaurants milte hain.",tip:"Jaane se pehle Google Maps par reviews aur menu check kar lo.",go:"Times Square se west ki taraf 9th Ave (Hell’s Kitchen) tak ~10 min walk karo ($0).",q:"Dinner ka photo lo",m:"restaurants Hell's Kitchen 9th Avenue New York"},
{id:"s10",t:"9:00 PM",n:"Greenwich Village Halloween",e:"🎃",h:25,dur:"~100 min",d:"Washington Square Park ka arch aur Village ki gallis. Halloween par costumes aur parade ka mahaul hota hai.",tip:"Parade ka route aur timing pehle online check karo, kuch streets band ho sakti hain.",go:"42 St–Port Authority se A/C/E lo aur West 4 St–Washington Sq utro (~10–12 min, $3). Weekend service changes pehle check kar lena.",q:"Sabse creative costume dhundho (permission lekar photo lo)",m:"Washington Square Park New York"},
{id:"s11",t:"10:45 PM",n:"Late-night pizza slice",e:"🍕",h:45,dur:"~30 min",d:"Classic NYC slice, Joe’s Pizza (Carmine St) ya koi bhi slice shop. Din bhar ki walking ke baad perfect.",tip:"Slice ko fold karke khao, New Yorker style.",go:"Washington Square Park se Carmine St tak ~8 min walk ($0).",q:"Pizza fold karke khao",m:"Joe's Pizza Carmine Street New York"},
{id:"s12",t:"11:30 PM",n:"Head back to hotel",e:"🛏️",h:250,dur:"till midnight",d:"Subway ya Uber se hotel wapas jao. Halloween ki raat trains mein bheed ho sakti hai, thoda buffer rakho.",tip:"Well-lit aur busy routes lo, akele sunsaan gali se bacho.",go:"Christopher St–Sheridan Sq se 1 train uptown lo aur 86 St utro (direct, ~25–30 min, $3), phir ~8 min walk east hostel tak (88th St, CPW aur Columbus ke beech). Raat ko trains 15–20 min mein aati hain, Uber backup rakho. Hostel ka office 11 baje tak khula hai, late entry ka rule pehle puchh lena.",q:"Aaj ki favourite memory notes mein likh do",m:"New York"}
];
var BG=[{n:"Early Bird",e:"🌅",f:function(x){return x.s1}},{n:"Foodie",e:"🍴",f:function(x){return x.s4&&x.s9&&x.s11}},{n:"Sky High",e:"🏙️",f:function(x){return x.s7}},{n:"Night Owl",e:"🦉",f:function(x){return x.s10}},{n:"Legend",e:"🏆",f:function(x){return S.every(function(s){return x[s.id]})}}];
var LV=[[0,"Tourist","🎒"],[300,"Explorer","🧭"],[700,"Local","🗽"],[1100,"NYC Legend","👑"]];
var INFO='<article class="card"><div class="body"><h2>🚇 Transport guide</h2><p>📍 Start: International Student Center, 38 W 88th St (Central Park West aur Columbus Ave ke beech). Sabse paas subway: C train, 86 St (Central Park West), aur 1 train, 86 St (Broadway, ~5 min walk). B train sirf weekdays par chalti hai.</p><p>💳 Fare: $3 per ride (subway ya local bus). Contactless card ya phone tap karo. Physical OMNY card $2 mein station machines par milta hai. Poore din same card use karo.</p><p>🔁 Subway ↔ local bus transfer free hai, 2 ghante ke andar.</p><p>💰 Aaj ke plan mein lagbhag 5 subway rides = ~$15.</p><p>🕒 Subway 24x7 chalti hai, par raat aur weekend par trains kam aati hain. Weekend service changes MTA app ya Google Maps par check karo.</p><p>🚌 Bus bhi $3 hai, par traffic mein slow. Broadway par M104 Times Square ki taraf jaati hai.</p><p class="tip">Saare timings approximate hain, live timing Google Maps ya Citymapper par dekh lena.</p></div></article>';
var KEY="nyc-quest-v1",st={done:{},quest:{},skip:{},note:{}};
try{var r=localStorage.getItem(KEY);if(r){var p=JSON.parse(r);for(var k in p)st[k]=p[k]}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function mins(t){var m=t.match(/(\d+):(\d+) (AM|PM)/),h=+m[1]%12;if(m[3]==="PM")h+=12;return h*60+ +m[2]}
function xp(){var x=0;S.forEach(function(s){if(st.done[s.id])x+=100;if(st.quest[s.id])x+=50});return x}
function lvl(x){var l=LV[0];LV.forEach(function(v){if(x>=v[0])l=v});return l}
function toast(m){var t=document.getElementById("toast");t.textContent=m;t.className="show";clearTimeout(toast.h);toast.h=setTimeout(function(){t.className=""},1800)}
function nextId(){for(var i=0;i<S.length;i++)if(!st.done[S[i].id]&&!st.skip[S[i].id])return S[i].id;return null}
function nowId(){var d=new Date();if(d.getMonth()!==9||d.getDate()!==31)return null;var n=d.getHours()*60+d.getMinutes(),c=null;S.forEach(function(s){if(mins(s.t)<=n)c=s.id});return c}
function render(){
 var x=xp(),l=lvl(x),max=S.length*150,nx=nextId(),nw=nowId(),dn=S.filter(function(s){return st.done[s.id]}).length;
 var nl=LV.filter(function(v){return v[0]>x})[0];
 document.getElementById("hd").innerHTML='<div class="row"><div><h1>🗽 NYC Quest: 24 Hours</h1><div class="sub">Sat 31 Oct · 9 AM se Midnight</div></div><div class="lvl">'+l[2]+' '+l[1]+'</div></div><div class="bar"><i style="width:'+Math.min(100,x/max*100)+'%"></i></div><div class="stats"><span>'+x+' XP'+(nl?' · agla level '+nl[1]+' @ '+nl[0]:' · Max level!')+'</span><span>'+dn+'/'+S.length+' stops</span></div><div class="badges">'+BG.map(function(b){return '<span class="badge'+(b.f(st.done)?' on':'')+'">'+b.e+' '+b.n+'</span>'}).join("")+'</div>';
 document.getElementById("app").innerHTML=INFO+S.map(function(s){
  var dn=st.done[s.id],sk=st.skip[s.id],cls=dn?"done":sk?"skip":s.id===nx?"next":"";
  var tag=dn?"✓ Done":sk?"Skipped":s.id===nw?"⏰ Abhi ka time":s.id===nx?"👉 Up next":"";
  return '<article class="card '+cls+'" id="c-'+s.id+'"><div class="art" style="--h:'+s.h+'">'+s.e+'</div><div class="body"><div class="top"><span class="time">'+s.t+'</span><span class="dur">'+s.dur+'</span><span class="tag">'+tag+'</span></div><h2>'+esc(s.n)+'</h2><p>'+esc(s.d)+'</p><p class="tip">💡 '+esc(s.tip)+'</p><div class="go"><b>🚇 Kaise pahuchein</b><br>'+esc(s.go)+'</div><label class="quest"><input type="checkbox" data-q="'+s.id+'"'+(st.quest[s.id]?" checked":"")+'><span>🎯 Mission: '+esc(s.q)+' <b>+50 XP</b></span></label><div class="links"><a href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(s.m)+'" target="_blank" rel="noopener">📍 Map</a><a href="https://www.google.com/search?tbm=isch&q='+encodeURIComponent(s.m)+'" target="_blank" rel="noopener">📸 Photos</a></div><textarea data-n="'+s.id+'" placeholder="Apne notes yahan likho...">'+esc(st.note[s.id]||"")+'</textarea><div class="acts"><button class="'+(dn?"undo":"")+'" data-d="'+s.id+'">'+(dn?"✓ Done (undo)":"Check in +100 XP")+'</button><button class="ghost" data-s="'+s.id+'">'+(sk?"Unskip":"Skip")+'</button></div></div></article>';
 }).join("")+'<button class="reset" data-r="1">Progress reset karo</button>';
}
document.addEventListener("click",function(e){
 var b=e.target.closest("button");if(!b)return;
 if(b.dataset.d){var id=b.dataset.d,before=lvl(xp())[1];st.done[id]=!st.done[id];if(st.done[id]){delete st.skip[id]}save();render();
  if(st.done[id]){var a=lvl(xp())[1];toast(a!==before?"🎉 Level up: "+a+"!":"+100 XP! Mast chal raha hai 🔥");var n=nextId();if(n)setTimeout(function(){var c=document.getElementById("c-"+n);if(c)c.scrollIntoView({behavior:"smooth",block:"start"})},500)}}
 else if(b.dataset.s){var i=b.dataset.s;st.skip[i]=!st.skip[i];if(st.skip[i])delete st.done[i];save();render()}
 else if(b.dataset.r){if(confirm("Saara progress delete ho jayega. Pakka?")){st={done:{},quest:{},skip:{},note:{}};save();render()}}
});
document.addEventListener("change",function(e){var q=e.target.dataset&&e.target.dataset.q;if(q){st.quest[q]=e.target.checked;save();render();if(st.quest[q])toast("+50 XP! Mission complete 🎯")}});
document.addEventListener("input",function(e){var n=e.target.dataset&&e.target.dataset.n;if(n){st.note[n]=e.target.value;save()}});
render();
</script>
</body>
</html>
